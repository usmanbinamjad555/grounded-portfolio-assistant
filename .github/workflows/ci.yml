name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci rejects this lockfile on Linux: npm 11 on Windows marks esbuild's platform packages
      # (pulled in by tsx) as extraneous instead of optional. npm install resolves them correctly.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
